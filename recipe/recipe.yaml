context:
  version: "0.22.1"
  build_number: 0

package:
  name: xleaflet
  version: ${{ version }}

source:
  url: https://github.com/jupyter-xeus/xleaflet/archive/${{ version }}.tar.gz
  sha256: 043ecfb4286ae2c43f155fec24955fded7c1bbf0520e88d80b4259befd6a9434

build:
  number: ${{ build_number }}

requirements:
  run_exports:
    - ${{ pin_subpackage('xleaflet', upper_bound='x.x') }}
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake
    - if: unix
      then:
        - make
  host:
    - xeus >=6.2.0,<7.0
    - xproperty >=0.13.1,<0.14.0
    - xwidgets >=0.31,<0.32.0
    - xtensor >=0.27.2,<0.28
    - nlohmann_json
    - nlohmann_json-abi
  run:
    - xtensor >=0.27.2,<0.28

tests:
  - package_contents:
      files:
        exists:
          - ${{ "Library/" if win }}include/xleaflet/xmap.hpp
          - ${{ "Library/" if win }}lib/cmake/xleaflet/xleafletConfig.cmake
          - ${{ "Library/" if win }}lib/cmake/xleaflet/xleafletConfigVersion.cmake

about:
  homepage: http://quantstack.net/xleaflet
  repository: https://github.com/jupyter-xeus/xleaflet
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: C++ backend for the jupyter leaflet widget
  documentation: http://xleaflet.readthedocs.io

extra:
  recipe-maintainers:
    - SylvainCorlay
    - JohanMabille
    - martinRenou
